# nginx cho ailabelremover.work — phục vụ thư mục dist/ (bản build đã prerender).
# Thay cho public/_headers và public/_redirects (chỉ Cloudflare/Netlify đọc hai tệp đó, nginx thì không).
# Dùng: chép vào /etc/nginx/conf.d/ (hoặc sites-available), sửa đường dẫn root + chứng chỉ, rồi `nginx -t && nginx -s reload`.

server {
  listen 80;
  listen [::]:80;
  server_name ailabelremover.work;
  return 301 https://ailabelremover.work$request_uri;
}

# Không có bản ghi DNS / chứng chỉ cho www → không khai báo www. Muốn dùng www: thêm DNS, chạy
# `certbot --nginx -d ailabelremover.work -d www.ailabelremover.work`, rồi thêm khối server 301 www → gốc.

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;                       # nhiều tệp tải song song trên một kết nối
  server_name ailabelremover.work;

  ssl_certificate     /etc/letsencrypt/live/ailabelremover.work/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ailabelremover.work/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;   # do certbot tạo
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /var/www/ailabelremover;   # nơi lệnh deploy rsync dist/ vào
  index index.html;

  # Nén văn bản: HTML/JS/CSS giảm ~70–80% dung lượng (PageSpeed: "Enable text compression").
  # Đặt trong khối server (không phải http) để không đụng site khác trên cùng máy chủ.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json
             application/xml image/svg+xml font/ttf font/otf;
  # Nếu máy chủ có module brotli (ngx_brotli), bật thêm để nhỏ hơn gzip ~15–20%:
  # brotli on; brotli_comp_level 5; brotli_types text/css text/xml application/javascript application/json application/manifest+json image/svg+xml;

  # Bảo mật cơ bản (như public/_headers).
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Tệp có mã băm trong tên → cache 1 năm, không cần hỏi lại máy chủ.
  # (add_header trong location thay cho khối server, nên lặp lại header bảo mật.)
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Ảnh chia sẻ, biểu tượng, manifest: cache 1 ngày.
  location ~* ^/(og/|favicon\.svg|icon-\d+\.png|apple-touch-icon\.png|site\.webmanifest) {
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Trang đã gộp (như public/_redirects): /remove-ai-metadata/ → /ai-tag-cleaner/, mọi ngôn ngữ.
  location ~ ^/(?:([a-z]{2}(?:-[a-z]{2})?)/)?remove-ai-metadata/?$ {
    if ($1) { return 301 /$1/ai-tag-cleaner/; }
    return 301 /ai-tag-cleaner/;
  }

  # HTML: luôn kiểm tra bản mới (nội dung đổi sau mỗi lần deploy, tên tệp không đổi).
  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri $uri/index.html $uri/ =404;
  }

  # URL không tồn tại → mã 404 thật + trang 404.html (noindex), tránh "soft 404".
  error_page 404 /404.html;
  location = /404.html { internal; }
}
